[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelapi"
version = "1.0.0"
description = "AI-driven OpenAPI contract tester and security fuzzer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "fastapi>=0.110", "uvicorn>=0.29", "coverage>=7"]

[project.scripts]
sentinelapi = "sentinelapi.cli:main"

[tool.setuptools.packages.find]
include = ["sentinelapi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
