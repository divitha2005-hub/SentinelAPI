name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy: {matrix: {python: ["3.10", "3.12"]}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Self-scan the demo API (gate on critical findings is expected to fail)
        run: |
          python -c "import json,demo_api;json.dump(demo_api.app.openapi(),open('demo_openapi.json','w'))"
          sentinelapi demo_openapi.json --asgi demo_api:app --cov-source demo_api.py --out out || true
      - uses: github/codeql-action/upload-sarif@v3
        if: matrix.python == '3.12'
        with: {sarif_file: out/results.sarif}
